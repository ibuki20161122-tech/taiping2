<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>もじぱち！</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap');
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{width:100%;height:100%;overflow:hidden;}
  body{font-family:'Noto Sans JP',sans-serif;background:#0a0a0f;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;color:#e0e0f0;}
  #root{width:100vw;height:100vh;display:flex;flex-direction:column;align-items:center;padding:3rem 2rem;position:relative;justify-content:center;}
  #root::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 60% 40% at 50% 0%,#1a0a3a 0%,transparent 70%);pointer-events:none;}
  .scanlines{position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,.04) 3px,rgba(0,0,0,.04) 4px);pointer-events:none;}
  #s-start,#s-game,#s-result{position:relative;z-index:1;width:100%;max-width:860px;display:none;flex-direction:column;align-items:center;gap:1.6rem;}
  .on{display:flex!important;}
  .title{font-family:'JetBrains Mono',monospace;font-size:clamp(2rem,5vw,3.5rem);font-weight:600;color:#a78bfa;text-shadow:0 0 30px rgba(167,139,250,.5);}
  .sub{font-size:.85rem;color:#6b7280;letter-spacing:.15em;text-transform:uppercase;}
  .btn{background:transparent;border:1px solid #a78bfa;color:#a78bfa;padding:.7rem 2.2rem;font-size:1rem;font-family:'JetBrains Mono',monospace;cursor:pointer;border-radius:4px;transition:all .2s;}
  .btn:hover{background:rgba(167,139,250,.15);box-shadow:0 0 20px rgba(167,139,250,.3);}
  .diffs{display:flex;gap:1rem;}
  .db{background:transparent;border:1px solid #374151;color:#9ca3af;padding:.5rem 1.1rem;font-size:.85rem;cursor:pointer;border-radius:4px;transition:all .2s;}
  .db.sel{border-color:#a78bfa;color:#a78bfa;background:rgba(167,139,250,.1);}
  .stats{display:flex;gap:3rem;justify-content:center;}
  .sb{text-align:center;}
  .sl{font-size:.75rem;color:#6b7280;letter-spacing:.1em;text-transform:uppercase;margin-bottom:3px;}
  .sv{font-family:'JetBrains Mono',monospace;font-size:clamp(1.3rem,3vw,2rem);font-weight:600;}
  .sv.ac{color:#a78bfa;}
  .kanji{font-size:clamp(2.5rem,8vw,5rem);font-weight:700;color:#f0f0ff;min-height:5rem;text-align:center;line-height:1.2;}
  .kanji ruby{display:inline-flex;flex-direction:column;align-items:center;line-height:1;}
  .kanji rt{font-size:clamp(0.55rem,1.5vw,0.85rem);color:#a78bfa;letter-spacing:0.05em;font-weight:400;margin-bottom:2px;line-height:1;}
  .romaji{font-family:'JetBrains Mono',monospace;font-size:clamp(1.4rem,4vw,2.5rem);letter-spacing:.15em;min-height:2.5rem;text-align:center;}
  .t{color:#34d399;}
  .c{color:#a78bfa;text-shadow:0 0 12px rgba(167,139,250,.8);animation:blink .7s step-end infinite;}
  .r{color:#4b5563;}
  @keyframes blink{50%{opacity:.3;}}
  #inp-display{width:100%;max-width:700px;background:rgba(255,255,255,.03);border:1px solid #a78bfa;border-radius:8px;padding:1.1rem 1.8rem;font-family:'JetBrains Mono',monospace;font-size:clamp(1rem,2.5vw,1.4rem);color:#e0e0f0;min-height:3.6rem;letter-spacing:.08em;transition:border-color .2s;box-shadow:0 0 0 2px rgba(167,139,250,.15);display:flex;align-items:center;}

  .inp-placeholder{color:#374151;}

<script>
// ===================================================
// クッキー操作
// ===================================================
function setCookie(name, value, days) {
  const exp = new Date(Date.now() + days * 864e5).toUTCString();
  document.cookie = `${name}=${encodeURIComponent(value)};expires=${exp};path=/;SameSite=Lax`;
}
function getCookie(name) {
  const m = document.cookie.match('(?:^|; )' + name + '=([^;]*)');
  return m ? decodeURIComponent(m[1]) : null;
}

// ハイスコアをクッキーから読む（難易度別）
function loadHS(d) {
  return parseInt(getCookie('hs_' + d) || '0', 10);
}
function saveHS(d, val) {
  setCookie('hs_' + d, val, 365); // 1年保存
}

// ===================================================
// かな→ローマ字テーブル（MS-IME2000 完全版）
// 先頭が標準表示パターン、以降が代替入力
// ん：単語末尾は nn 固定（parseKana内で処理）
// ===================================================
const TBL = {

  'ぁ':['la','xa'],'ぃ':['li','xi','lyi','xyi'],'ぅ':['lu','xu'],
  'ぇ':['le','xe','lye','xye'],'ぉ':['lo','xo'],
  'いぇ':['ye'],
  'うぁ':['wha'],'うぃ':['whi','wi'],'うぇ':['whe','we'],'うぉ':['who'],

  // ── か行 ──
  'か':['ka','ca'],'き':['ki'],'く':['ku','cu','qu'],'け':['ke'],'こ':['ko','co'],
  'きゃ':['kya'],'きぃ':['kyi'],'きゅ':['kyu'],'きぇ':['kye'],'きょ':['kyo'],
  'くぁ':['qwa','qa'],'くぃ':['qwi','qi'],'くぅ':['qwu'],'くぇ':['qwe','qe'],'くぉ':['qwo','qo'],
  'くゃ':['qya'],'くゅ':['qyu'],'くょ':['qyo'],
  // が行
  'が':['ga'],'ぎ':['gi'],'ぐ':['gu'],'げ':['ge'],'ご':['go'],
  'ぎゃ':['gya'],'ぎぃ':['gyi'],'ぎゅ':['gyu'],'ぎぇ':['gye'],'ぎょ':['gyo'],
  'ぐぁ':['gwa'],'ぐぃ':['gwi'],'ぐぅ':['gwu'],'ぐぇ':['gwe'],'ぐぉ':['gwo'],

  // ── さ行 ──
  'さ':['sa'],'し':['shi','si','ci'],'す':['su'],'せ':['se','ce'],'そ':['so'],
  'しゃ':['sha','sya'],'しぃ':['syi'],'しゅ':['shu','syu'],'しぇ':['she','sye'],'しょ':['sho','syo'],
  'すぁ':['swa'],'すぃ':['swi'],'すぅ':['swu'],'すぇ':['swe'],'すぉ':['swo'],
  // ざ行
  'ざ':['za'],'じ':['ji','zi'],'ず':['zu'],'ぜ':['ze'],'ぞ':['zo'],
  'じゃ':['ja','jya','zya'],'じぃ':['jyi','zyi'],'じゅ':['ju','jyu','zyu'],'じぇ':['je','jye','zye'],'じょ':['jo','jyo','zyo'],

  // ── た行 ──
  'た':['ta'],'ち':['chi','ti'],'つ':['tsu','tu'],'て':['te'],'と':['to'],
  'ちゃ':['cha','tya','cya'],'ちぃ':['tyi','cyi'],'ちゅ':['chu','tyu','cyu'],'ちぇ':['che','tye','cye'],'ちょ':['cho','tyo','cyo'],
  'つぁ':['tsa'],'つぃ':['tsi'],'つぇ':['tse'],'つぉ':['tso'],
  'てゃ':['tha'],'てぃ':['thi'],'てゅ':['thu'],'てぇ':['the'],'てょ':['tho'],
  'とぁ':['twa'],'とぃ':['twi'],'とぅ':['twu'],'とぇ':['twe'],'とぉ':['two'],
  // だ行
  'だ':['da'],'ぢ':['di'],'づ':['du'],'で':['de'],'ど':['do'],
  'ぢゃ':['dya'],'ぢぃ':['dyi'],'ぢゅ':['dyu'],'ぢぇ':['dye'],'ぢょ':['dyo'],
  'でゃ':['dha'],'でぃ':['dhi'],'でゅ':['dhu'],'でぇ':['dhe'],'でょ':['dho'],
  'どぁ':['dwa'],'どぃ':['dwi'],'どぅ':['dwu'],'どぇ':['dwe'],'どぉ':['dwo'],

  // ── な行 ──
  'な':['na'],'に':['ni'],'ぬ':['nu'],'ね':['ne'],'の':['no'],
  'にゃ':['nya'],'にぃ':['nyi'],'にゅ':['nyu'],'にぇ':['nye'],'にょ':['nyo'],

  // ── は行 ──
  'は':['ha'],'ひ':['hi'],'ふ':['fu','hu'],'へ':['he'],'ほ':['ho'],
  'ひゃ':['hya'],'ひぃ':['hyi'],'ひゅ':['hyu'],'ひぇ':['hye'],'ひょ':['hyo'],
  'ふぁ':['fa','fwa'],'ふぃ':['fi','fwi','fyi'],'ふぅ':['fwu'],'ふぇ':['fe','fwe','fye'],'ふぉ':['fo','fwo'],
  'ふゃ':['fya'],'ふゅ':['fyu'],'ふょ':['fyo'],
  // ば行
  'ば':['ba'],'び':['bi'],'ぶ':['bu'],'べ':['be'],'ぼ':['bo'],
  'びゃ':['bya'],'びぃ':['byi'],'びゅ':['byu'],'びぇ':['bye'],'びょ':['byo'],
  // ぱ行
  'ぱ':['pa'],'ぴ':['pi'],'ぷ':['pu'],'ぺ':['pe'],'ぽ':['po'],
  'ぴゃ':['pya'],'ぴぃ':['pyi'],'ぴゅ':['pyu'],'ぴぇ':['pye'],'ぴょ':['pyo'],

  // ── ま行 ──
  'ま':['ma'],'み':['mi'],'む':['mu'],'め':['me'],'も':['mo'],
  'みゃ':['mya'],'みぃ':['myi'],'みゅ':['myu'],'みぇ':['mye'],'みょ':['myo'],

  // ── や行 ──
  'や':['ya'],'ゆ':['yu'],'よ':['yo'],
  'ゃ':['lya','xya'],'ゅ':['lyu','xyu'],'ょ':['lyo','xyo'],

  // ── ら行 ──
  'ら':['ra'],'り':['ri'],'る':['ru'],'れ':['re'],'ろ':['ro'],
  'りゃ':['rya'],'りぃ':['ryi'],'りゅ':['ryu'],'りぇ':['rye'],'りょ':['ryo'],

  // ── わ行・ん ──
  'わ':['wa'],'を':['wo'],
  'ん':['nn'], // 単語末尾は必ず nn（parseKana内で制御）

  // ── 長音符 ──
  'ー':['-'],

  // ── 外来語・特殊かな ──
  'てぃ':['thi'],'てゅ':['thu'],
  'でぃ':['dhi'],'でゅ':['dhu'],
  'とぅ':['twu'],
  'どぅ':['dwu'],
  'ふぁ':['fa','fwa'],'ふぃ':['fi','fyi'],'ふぇ':['fe','fye'],'ふぉ':['fo'],
  'うぃ':['whi','wi'],'うぇ':['whe','we'],'うぁ':['wha'],'うぉ':['who'],
  'ゔぁ':['va'],'ゔぃ':['vi'],'ゔ':['vu'],'ゔぇ':['ve'],'ゔぉ':['vo'],
  'いぇ':['ye'],
  'くぁ':['qwa','qa'],'くぃ':['qwi'],'くぇ':['qwe'],'くぉ':['qwo'],

  // ── 小文字単独 ──
  'っ':['ltu','xtu','ltsu'], // parseKanaで促音処理するがフォールバック用

function parseKana(str) {
  // カタカナをひらがなに変換（ー・ヴ等は保持）
  str = str.replace(/[\u30A1-\u30F6]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));

  const segs = [];
  let i = 0;
  while (i < str.length) {

    // ─── 促音 っ ───
    if (str[i] === 'っ') {
      let nextPats = null;
      if (i + 1 < str.length) {
        const two = str.substring(i+1, i+3);
        const one = str[i+1];
        nextPats = TBL[two] || TBL[one];
      }
      const cSet = new Set();
      if (nextPats) for (const p of nextPats)
        if (/[bcdfghjklmnpqrstvwxyz]/.test(p[0])) cSet.add(p[0]);
      segs.push({ kana:'っ', patterns: cSet.size ? [...cSet] : ['ltu'] });
      i++; continue;
    }

    // ─── ん ───
    if (str[i] === 'ん') {
      const isLast = (i + 1 >= str.length);
      // 末尾：nn のみ
      // 次が母音(aiueo)またはn：nn または n' (ここでは nn のみ対応)
      // 次が子音：n または nn どちらも可
      if (isLast) {
        segs.push({ kana:'ん', patterns: ['nn'] });
      } else {
        const nextChar = str[i+1];
        const nextTwo = str.substring(i+1, i+3);
        const nextPats = TBL[nextTwo] || TBL[nextChar] || [];
        const nextFirstChar = nextPats.length > 0 ? nextPats[0][0] : nextChar;
        if (/[aiueo]/.test(nextFirstChar) || nextChar === 'ん') {
          // 母音・ん が続く場合：nn のみ（n単独だとかにになる等の誤変換防止）
          segs.push({ kana:'ん', patterns: ['nn'] });
        } else {
          // 子音が続く場合：n または nn どちらも可
          segs.push({ kana:'ん', patterns: ['n','nn'] });
        }
      }
      i++; continue;
    }

    // ─── 3文字複合（てぃ・でぃ等は2文字なので不要。将来拡張用） ───

    // ─── 2文字複合優先 ───
    if (i + 1 < str.length) {
      const two = str.substring(i, i+2);
      if (TBL[two]) { segs.push({ kana:two, patterns:TBL[two] }); i+=2; continue; }
    }

    // ─── 1文字 ───
    const one = str[i];
    segs.push({ kana:one, patterns:TBL[one]||[one] });
    i++;
  }
  return segs;
}

// ===================================================
// 単語データ  k=ひらがな(入力用)  j=漢字表記(表示用)
// ===================================================

    {k:'あお',j:'青'},{k:'あか',j:'赤'},{k:'しろ',j:'白'},{k:'くろ',j:'黒'},
    {k:'みどり',j:'緑'},{k:'きいろ',j:'黄色'},{k:'もも',j:'桃'},{k:'なし',j:'梨'},
    {k:'かき',j:'柿'},{k:'すいか',j:'西瓜'},{k:'ぶどう',j:'葡萄'},

    {k:'にく',j:'肉'},{k:'やさい',j:'野菜'},{k:'くだもの',j:'果物'},
    {k:'おちゃ',j:'お茶'},{k:'ぎゅうにゅう',j:'牛乳'},{k:'たいこ',j:'太鼓'},
    {k:'ふえ',j:'笛'},{k:'ほし',j:'星'},{k:'にじ',j:'虹'},
  ],
  normal:[

    {k:'でぃーぷらーにんぐ',j:'ディープラーニング'},
    {k:'ぶろっくちぇーん',j:'ブロックチェーン'},
    {k:'さいばーせきゅりてぃ',j:'サイバーセキュリティ'},
    {k:'おーぷんそーす',j:'オープンソース'},
    {k:'ふれーむわーく',j:'フレームワーク'},
    {k:'いんふらすとらくちゃー',j:'インフラストラクチャー'},
    {k:'でぃべろっぱー',j:'デベロッパー'},
  ],
};
const TIMES = {easy:60, normal:50, hard:40};
const DIFF_LABEL = {easy:'かんたん', normal:'ふつう', hard:'むずかしい'};

// ===================================================
// ゲーム状態
// ===================================================
let diff = 'easy';
let score=0, correct=0, missCnt=0, okKeys=0, allKeys=0;
let timeLeft=60, maxTime=60, tmr=null, active=false;
let used=[];
let segs=[], si=0, committed='', pending='', valid=[];

const $ = id => document.getElementById(id);
const inpDisplay = $('inp-display');

// ===================================================
// スタート画面のハイスコア表示
// ===================================================
function renderStartHS() {
  const diffs = ['easy','normal','hard'];
  $('start-hs').innerHTML = diffs.map(d => {
    const hs = loadHS(d);
    return `<div class="hs-card">
      <div class="hcl">${DIFF_LABEL[d]}</div>
      <div class="hcv">${hs > 0 ? hs : '—'}</div>
    </div>`;
  }).join('');
}

// ===================================================
// ボタン・キーバインド
// ===================================================
document.querySelectorAll('.db').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.db').forEach(x => x.classList.remove('sel'));
    b.classList.add('sel');
    diff = b.dataset.d;
  });
});

$('btn-start').addEventListener('click', startGame);
$('btn-retry').addEventListener('click', goToStart);

document.addEventListener('keydown', e => {
  // Esc: ゲーム中にメニューへ戻る
  if (e.code === 'Escape' && active) {
    e.preventDefault();
    clearInterval(tmr);
    active = false;
    $('s-game').classList.remove('on');
    $('s-start').classList.add('on');
    renderStartHS();
    return;
  }
  // Space: スタート or リザルト → 次へ
  if (e.code === 'Space') {
    if (!active && $('s-start').classList.contains('on')) { e.preventDefault(); startGame(); return; }
    if (!active && $('s-result').classList.contains('on')) { e.preventDefault(); goToStart(); return; }
  }
  // ゲーム中のタイピング
  if (!active || e.key.length !== 1) return;
  e.preventDefault();

  const ch = e.key.toLowerCase();
  allKeys++;

  const trial = pending + ch;
  const matched = valid.filter(p => p.startsWith(trial));

  if (matched.length === 0) {
    missCnt++;
    const exp = valid[0][pending.length] || '?';
    showErr(`✗ "${e.key}"  →  正しくは "${exp}"`);
    soundMiss();
    updateStats(); return;
  }

  soundType();
  okKeys++;
  pending = trial;
  valid = matched;

  if (valid.find(p => p === pending)) {
    committed += pending;
    si++;
    pending = '';
    if (si >= segs.length) { wordDone(); return; }
    valid = [...segs[si].patterns];
  }

  $('v-err').textContent = '';
  updateStats();
  render();
});

function goToStart() {
  $('s-result').classList.remove('on');
  $('s-start').classList.add('on');
  renderStartHS();
}

// スタート音：上昇するファンファーレ風
function soundStart() {
  try {
    const ctx = getAudio();
    const notes = [523, 659, 784, 1047]; // ド・ミ・ソ・ド（高）
    notes.forEach((f, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = 'sine';
      const t = ctx.currentTime + i * 0.1;
      osc.frequency.setValueAtTime(f, t);
      gain.gain.setValueAtTime(0.25, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
      osc.start(t); osc.stop(t + 0.18);
    });
  } catch(e){}
}

// ===================================================
// ゲーム開始 / 終了
// ===================================================
function startGame() {
  $('s-start').classList.remove('on');
  $('s-game').classList.add('on');
  score=0; correct=0; missCnt=0; okKeys=0; allKeys=0; used=[];
  maxTime = TIMES[diff]; timeLeft = maxTime;
  active = true;
  soundStart();
  updateStats(); nextWord();
  tmr = setInterval(() => {
    timeLeft--;
    $('v-time').textContent = timeLeft;
    $('pbi').style.width = (timeLeft / maxTime * 100) + '%';
    if (timeLeft <= 0) endGame();
  }, 1000);
}

function endGame() {
  clearInterval(tmr); active = false;
  $('s-game').classList.remove('on');
  $('s-result').classList.add('on');

  const acc = allKeys > 0 ? Math.round(okKeys / allKeys * 100) : 100;

  // ハイスコア判定・保存
  const prevHS = loadHS(diff);
  const isNew = score > prevHS;
  if (isNew) saveHS(diff, score);
  const dispHS = isNew ? score : prevHS;

  $('r-score').textContent = score;
  $('r-correct').textContent = correct;
  $('r-miss').textContent = missCnt;
  $('r-acc').textContent = acc + '%';
  $('r-hs').textContent = dispHS;
  $('r-newrecord').innerHTML = isNew
    ? '<div class="new-record">🎉 NEW RECORD!</div>'
    : '';
  $('r-stars').textContent = ['★☆☆☆☆','★★☆☆☆','★★★☆☆','★★★★☆','★★★★★'][
    acc<60?0:acc<75?1:acc<85?2:acc<95?3:4];
}

// ===================================================
// 単語ロード
// ===================================================
function getWord() {
  const pool = WORDS[diff];
  let av = pool.filter(w => !used.includes(w.k));
  if (!av.length) { used = []; av = pool; }
  const w = av[Math.floor(Math.random() * av.length)];
  used.push(w.k); return w;
}

function nextWord() {
  const w = getWord();
  // ruby タグで漢字＋ふりがな表示
  $('v-kanji').innerHTML = `<ruby>${w.j}<rt>${w.k}</rt></ruby>`;
  segs = parseKana(w.k);
  si=0; committed=''; pending=''; valid=[...segs[0].patterns];
  $('v-err').textContent='';
  render();
}

// ===================================================
// 効果音（WebAudio API）
// ===================================================
let audioCtx = null;
function getAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

// 通常打鍵音：短いクリック
function soundType() {
  try {
    const ctx = getAudio();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(900, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(600, ctx.currentTime + 0.06);
    gain.gain.setValueAtTime(0.18, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.07);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.07);
  } catch(e){}
}

// 単語完了音：明るいポップ
function soundWord() {
  try {
    const ctx = getAudio();
    const freqs = [880, 1100, 1320];
    freqs.forEach((f, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = 'sine';
      const t = ctx.currentTime + i * 0.07;
      osc.frequency.setValueAtTime(f, t);
      gain.gain.setValueAtTime(0.22, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
      osc.start(t); osc.stop(t + 0.12);
    });
  } catch(e){}
}

// ミス音：低いブザー
function soundMiss() {
  try {
    const ctx = getAudio();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(180, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.15);
    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.15);
  } catch(e){}
}

function wordDone() {
  correct++;
  const len = segs.reduce((s, sg) => s + sg.patterns[0].length, 0);
  score += Math.floor(len * (diff==='hard'?15:diff==='normal'?10:7));
  soundWord();
  updateStats();
  nextWord();
}

function showErr(msg) {
  $('v-err').textContent = msg;
  inpDisplay.classList.remove('err'); void inpDisplay.offsetWidth; inpDisplay.classList.add('err');
  setTimeout(() => { inpDisplay.classList.remove('err'); $('v-err').textContent=''; }, 600);
}

// ===================================================
// 表示レンダリング
// ===================================================
function render() {
  let html = '';
  for (const c of committed) html += `<span class="t">${c}</span>`;
  if (si < segs.length) {
    for (const c of pending) html += `<span class="t">${c}</span>`;
    const rest = valid[0].slice(pending.length);
    for (let ri=0; ri<rest.length; ri++)
      html += `<span class="${ri===0?'c':'r'}">${rest[ri]}</span>`;
    for (let fi=si+1; fi<segs.length; fi++)
      for (const c of segs[fi].patterns[0])
        html += `<span class="r">${c}</span>`;
  }
  $('v-romaji').innerHTML = html;

  const alts = valid.filter(p => p !== valid[0]);
  $('v-alt').innerHTML = alts.length
    ? '別の入力: ' + alts.map(p=>`<span class="badge">${p}</span>`).join(' ')
    : '';

  // inp-display に入力済み文字＋カーソルを表示
  const typed = committed + pending;
  inpDisplay.innerHTML = typed
    ? `<span class="inp-typed">${typed}</span><span class="inp-cursor"></span>`
    : `<span class="inp-placeholder">キーボードで入力…</span>`;
}

function updateStats() {
  $('v-score').textContent = score;
  $('v-correct').textContent = correct;
  $('v-miss').textContent = missCnt;
}

// 初回ロード時にスタート画面のハイスコアを表示
renderStartHS();
