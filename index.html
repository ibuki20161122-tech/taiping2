  #inp:focus{border-color:#a78bfa;box-shadow:0 0 0 2px rgba(167,139,250,.15);}
  #inp.err{border-color:#ef4444;animation:shake .3s;}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  .pb{width:100%;max-width:700px;height:5px;background:#1f2937;border-radius:2px;overflow:hidden;}
  .pbi{height:100%;background:linear-gradient(90deg,#7c3aed,#a78bfa);transition:width .1s linear;}
  .miss{font-size:.8rem;color:#ef4444;min-height:1.2rem;font-family:'JetBrains Mono',monospace;}
  .alt{font-size:.72rem;color:#4b5563;font-family:'JetBrains Mono',monospace;min-height:1rem;}
  .badge{display:inline-block;background:rgba(167,139,250,.12);border:1px solid rgba(167,139,250,.3);color:#a78bfa;font-size:.65rem;font-family:'JetBrains Mono',monospace;padding:2px 6px;border-radius:3px;margin:0 2px;}

/* ── リザルト ── */
.rscore{font-family:‘JetBrains Mono’,monospace;font-size:4rem;font-weight:600;color:#a78bfa;text-shadow:0 0 40px rgba(167,139,250,.6);}
.rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;width:100%;max-width:420px;}
.ri{background:rgba(255,255,255,.03);border:1px solid #1f2937;border-radius:8px;padding:.75rem;text-align:center;}

.stars{font-size:1.2rem;color:#fbbf24;}

/* ── ハイスコアバナー ── */
.hs-banner{
display:flex;align-items:center;gap:.6rem;
background:rgba(167,139,250,.08);border:1px solid rgba(167,139,250,.25);
border-radius:8px;padding:.6rem 1.2rem;font-family:‘JetBrains Mono’,monospace;
font-size:.9rem;
}
.hs-banner .crown{font-size:1.1rem;}
.hs-banner .hs-label{color:#6b7280;font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;}
.hs-banner .hs-val{color:#fbbf24;font-size:1.3rem;font-weight:600;}
.new-record{
font-family:‘JetBrains Mono’,monospace;font-size:.85rem;color:#34d399;
letter-spacing:.1em;animation:pop .4s ease;
}
@keyframes pop{0%{transform:scale(.7);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}

/* ── スタート画面のハイスコア表示 ── */
.hs-grid{display:flex;gap:1rem;}
.hs-card{background:rgba(255,255,255,.03);border:1px solid #1f2937;border-radius:8px;padding:.6rem 1rem;text-align:center;min-width:90px;}
.hs-card .hcl{font-size:.65rem;color:#6b7280;text-transform:uppercase;letter-spacing:.08em;margin-bottom:2px;}
.hs-card .hcv{font-family:‘JetBrains Mono’,monospace;font-size:1.1rem;color:#fbbf24;font-weight:600;}

.hint-line{font-size:.75rem;color:#374151;text-align:center;line-height:2;}
</style>

<script>
// ===================================================
// クッキー操作
// ===================================================
function setCookie(name, value, days) {
  const exp = new Date(Date.now() + days * 864e5).toUTCString();
  document.cookie = `${name}=${encodeURIComponent(value)};expires=${exp};path=/;SameSite=Lax`;
}
function getCookie(name) {
  const m = document.cookie.match('(?:^|; )' + name + '=([^;]*)');
  return m ? decodeURIComponent(m[1]) : null;
}

// ハイスコアをクッキーから読む（難易度別）
function loadHS(d) {
  return parseInt(getCookie('hs_' + d) || '0', 10);
}
function saveHS(d, val) {
  setCookie('hs_' + d, val, 365); // 1年保存
}

// ===================================================
// かな→ローマ字テーブル
// ===================================================
const TBL = {
  'あ':['a'],'い':['i'],'う':['u'],'え':['e'],'お':['o'],
  'か':['ka'],'き':['ki'],'く':['ku'],'け':['ke'],'こ':['ko'],
  'さ':['sa'],'し':['shi','si'],'す':['su'],'せ':['se'],'そ':['so'],
  'た':['ta'],'ち':['chi','ti'],'つ':['tsu','tu'],'て':['te'],'と':['to'],
  'な':['na'],'に':['ni'],'ぬ':['nu'],'ね':['ne'],'の':['no'],
  'は':['ha'],'ひ':['hi'],'ふ':['fu','hu'],'へ':['he'],'ほ':['ho'],
  'ま':['ma'],'み':['mi'],'む':['mu'],'め':['me'],'も':['mo'],
  'や':['ya'],'ゆ':['yu'],'よ':['yo'],
  'ら':['ra'],'り':['ri'],'る':['ru'],'れ':['re'],'ろ':['ro'],
  'わ':['wa'],'を':['wo'],'ん':['n','nn'],
  'が':['ga'],'ぎ':['gi'],'ぐ':['gu'],'げ':['ge'],'ご':['go'],
  'ざ':['za'],'じ':['ji','zi'],'ず':['zu'],'ぜ':['ze'],'ぞ':['zo'],
  'だ':['da'],'で':['de'],'ど':['do'],
  'ば':['ba'],'び':['bi'],'ぶ':['bu'],'べ':['be'],'ぼ':['bo'],
  'ぱ':['pa'],'ぴ':['pi'],'ぷ':['pu'],'ぺ':['pe'],'ぽ':['po'],
  'きゃ':['kya'],'きゅ':['kyu'],'きょ':['kyo'],
  'しゃ':['sha','sya'],'しゅ':['shu','syu'],'しょ':['sho','syo'],
  'ちゃ':['cha','tya','cya'],'ちゅ':['chu','tyu','cyu'],'ちょ':['cho','tyo','cyo'],
  'にゃ':['nya'],'にゅ':['nyu'],'にょ':['nyo'],
  'ひゃ':['hya'],'ひゅ':['hyu'],'ひょ':['hyo'],
  'みゃ':['mya'],'みゅ':['myu'],'みょ':['myo'],
  'りゃ':['rya'],'りゅ':['ryu'],'りょ':['ryo'],
  'ぎゃ':['gya'],'ぎゅ':['gyu'],'ぎょ':['gyo'],
  'じゃ':['ja','jya','zya'],'じゅ':['ju','jyu','zyu'],'じょ':['jo','jyo','zyo'],
  'びゃ':['bya'],'びゅ':['byu'],'びょ':['byo'],
  'ぴゃ':['pya'],'ぴゅ':['pyu'],'ぴょ':['pyo'],
};

function parseKana(str) {
  const segs = [];
  let i = 0;
  while (i < str.length) {
    if (str[i] === 'っ') {
      let nextPats = null;
      if (i + 1 < str.length) {
        const two = str.substring(i+1, i+3);
        const one = str[i+1];
        nextPats = TBL[two] || TBL[one];
      }
      const cSet = new Set();
      if (nextPats) for (const p of nextPats)
        if (/[bcdfghjklmnpqrstvwxyz]/.test(p[0])) cSet.add(p[0]);
      segs.push({ kana:'っ', patterns: cSet.size ? [...cSet] : ['x'] });
      i++; continue;
    }
    if (i + 1 < str.length) {
      const two = str.substring(i, i+2);
      if (TBL[two]) { segs.push({ kana:two, patterns:TBL[two] }); i+=2; continue; }
    }
    const one = str[i];
    segs.push({ kana:one, patterns:TBL[one]||[one] });
    i++;
  }
  return segs;
}

// ===================================================
// 単語データ
// ===================================================
const WORDS = {
  easy:[
    {k:'ねこ'},{k:'いぬ'},{k:'さかな'},{k:'りんご'},{k:'みず'},{k:'そら'},
    {k:'はな'},{k:'つき'},{k:'やま'},{k:'かわ'},{k:'うみ'},{k:'きり'},
    {k:'あさ'},{k:'ゆき'},{k:'かぜ'},{k:'ひかり'},{k:'くも'},{k:'でんき'},
  ],
  normal:[
    {k:'さくらんぼ'},{k:'どうぶつ'},{k:'しんかんせん'},{k:'たいよう'},
    {k:'こうえん'},{k:'えいご'},{k:'でんしゃ'},{k:'きょうしつ'},
    {k:'おんがく'},{k:'しょくじ'},{k:'がっこう'},{k:'ともだち'},
    {k:'にほんご'},{k:'かいもの'},{k:'おきなわ'},{k:'ふじさん'},{k:'しゅくだい'},
  ],
  hard:[
    {k:'しゅっぱつ'},{k:'きんきゅう'},{k:'りょこうしゃ'},{k:'さんぽみち'},
    {k:'しんぶんしゃ'},{k:'けいたいでんわ'},{k:'しゅとけん'},
    {k:'きょうそうてき'},{k:'ぼうさいくんれん'},{k:'じゅうしょ'},
    {k:'しょっぱい'},{k:'きって'},{k:'ざっし'},
    {k:'ちょっかん'},{k:'しっかり'},{k:'ぴったり'},{k:'しゅくだい'},
  ],
};
const TIMES = {easy:60, normal:50, hard:40};
const DIFF_LABEL = {easy:'かんたん', normal:'ふつう', hard:'むずかしい'};

// ===================================================
// ゲーム状態
// ===================================================
let diff = 'easy';
let score=0, correct=0, missCnt=0, okKeys=0, allKeys=0;
let timeLeft=60, maxTime=60, tmr=null, active=false;
let used=[];
let segs=[], si=0, committed='', pending='', valid=[];

const $ = id => document.getElementById(id);
const inp = $('inp');

// ===================================================
// スタート画面のハイスコア表示
// ===================================================
function renderStartHS() {
  const diffs = ['easy','normal','hard'];
  $('start-hs').innerHTML = diffs.map(d => {
    const hs = loadHS(d);
    return `<div class="hs-card">
      <div class="hcl">${DIFF_LABEL[d]}</div>
      <div class="hcv">${hs > 0 ? hs : '—'}</div>
    </div>`;
  }).join('');
}

// ===================================================
// ボタン・キーバインド
// ===================================================
document.querySelectorAll('.db').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.db').forEach(x => x.classList.remove('sel'));
    b.classList.add('sel');
    diff = b.dataset.d;
  });
});

$('btn-start').addEventListener('click', startGame);
$('btn-retry').addEventListener('click', goToStart);

document.addEventListener('keydown', e => {
  // Esc: ゲーム中にメニューへ戻る
  if (e.code === 'Escape' && active) {
    e.preventDefault();
    clearInterval(tmr);
    active = false;
    inp.removeEventListener('keydown', onKey);
    $('s-game').classList.remove('on');
    $('s-start').classList.add('on');
    renderStartHS();
    return;
  }

  if (e.code !== 'Space') return;

  // スタート画面: Space でゲーム開始
  if (!active && $('s-start').classList.contains('on')) {
    e.preventDefault(); startGame(); return;
  }
  // リザルト画面: Space でスタート画面に戻る
  if (!active && $('s-result').classList.contains('on')) {
    e.preventDefault(); goToStart(); return;
  }
});

function goToStart() {
  $('s-result').classList.remove('on');
  $('s-start').classList.add('on');
  renderStartHS();
}

// スタート音：上昇するファンファーレ風
function soundStart() {
  try {
    const ctx = getAudio();
    const notes = [523, 659, 784, 1047]; // ド・ミ・ソ・ド（高）
    notes.forEach((f, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = 'sine';
      const t = ctx.currentTime + i * 0.1;
      osc.frequency.setValueAtTime(f, t);
      gain.gain.setValueAtTime(0.25, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
      osc.start(t); osc.stop(t + 0.18);
    });
  } catch(e){}
}

// ===================================================
// ゲーム開始 / 終了
// ===================================================
function startGame() {
  $('s-start').classList.remove('on');
  $('s-game').classList.add('on');
  score=0; correct=0; missCnt=0; okKeys=0; allKeys=0; used=[];
  maxTime = TIMES[diff]; timeLeft = maxTime;
  active = true;
  soundStart();
  updateStats(); nextWord();
  inp.value = ''; inp.focus();
  inp.addEventListener('keydown', onKey);
  tmr = setInterval(() => {
    timeLeft--;
    $('v-time').textContent = timeLeft;
    $('pbi').style.width = (timeLeft / maxTime * 100) + '%';
    if (timeLeft <= 0) endGame();
  }, 1000);
}

function endGame() {
  clearInterval(tmr); active = false;
  inp.removeEventListener('keydown', onKey);
  $('s-game').classList.remove('on');
  $('s-result').classList.add('on');

  const acc = allKeys > 0 ? Math.round(okKeys / allKeys * 100) : 100;
  const wpm = Math.round(correct * (60 / maxTime));

  // ハイスコア判定・保存
  const prevHS = loadHS(diff);
  const isNew = score > prevHS;
  if (isNew) saveHS(diff, score);
  const dispHS = isNew ? score : prevHS;

  $('r-score').textContent = score;
  $('r-correct').textContent = correct;
  $('r-wpm').textContent = wpm;
  $('r-acc').textContent = acc + '%';
  $('r-hs').textContent = dispHS;
  $('r-newrecord').innerHTML = isNew
    ? '<div class="new-record">🎉 NEW RECORD!</div>'
    : '';
  $('r-stars').textContent = ['★☆☆☆☆','★★☆☆☆','★★★☆☆','★★★★☆','★★★★★'][
    acc<60?0:acc<75?1:acc<85?2:acc<95?3:4];
}

// ===================================================
// 単語ロード
// ===================================================
function getWord() {
  const pool = WORDS[diff];
  let av = pool.filter(w => !used.includes(w.k));
  if (!av.length) { used = []; av = pool; }
  const w = av[Math.floor(Math.random() * av.length)];
  used.push(w.k); return w;
}

function nextWord() {
  const w = getWord();
  $('v-kanji').textContent = w.k;
  segs = parseKana(w.k);
  si=0; committed=''; pending=''; valid=[...segs[0].patterns];
  inp.value=''; $('v-err').textContent='';
  render();
}

// ===================================================
// 効果音（WebAudio API）
// ===================================================
let audioCtx = null;
function getAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

// 通常打鍵音：短いクリック
function soundType() {
  try {
    const ctx = getAudio();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(900, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(600, ctx.currentTime + 0.06);
    gain.gain.setValueAtTime(0.18, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.07);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.07);
  } catch(e){}
}

// 単語完了音：明るいポップ
function soundWord() {
  try {
    const ctx = getAudio();
    const freqs = [880, 1100, 1320];
    freqs.forEach((f, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = 'sine';
      const t = ctx.currentTime + i * 0.07;
      osc.frequency.setValueAtTime(f, t);
      gain.gain.setValueAtTime(0.22, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
      osc.start(t); osc.stop(t + 0.12);
    });
  } catch(e){}
}

// ミス音：低いブザー
function soundMiss() {
  try {
    const ctx = getAudio();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(180, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.15);
    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.15);
  } catch(e){}
}

// ===================================================
// キー入力
// ===================================================
function onKey(e) {
  if (!active || e.key.length !== 1) return;
  e.preventDefault();

  const ch = e.key.toLowerCase();
  allKeys++;

  const trial = pending + ch;
  const matched = valid.filter(p => p.startsWith(trial));

  if (matched.length === 0) {
    missCnt++;
    const exp = valid[0][pending.length] || '?';
    showErr(`✗ "${e.key}"  →  正しくは "${exp}"`);
    soundMiss();
    updateStats(); return;
  }

  soundType();
  okKeys++;
  pending = trial;
  valid = matched;

  if (valid.find(p => p === pending)) {
    committed += pending;
    si++;
    pending = '';
    if (si >= segs.length) { wordDone(); return; }
    valid = [...segs[si].patterns];
  }

  $('v-err').textContent = '';
  updateStats();
  render();
}

function wordDone() {
  correct++;
  const len = segs.reduce((s, sg) => s + sg.patterns[0].length, 0);
  score += Math.floor(len * (diff==='hard'?15:diff==='normal'?10:7));
  soundWord();
  updateStats();
  nextWord();
}

function showErr(msg) {
  $('v-err').textContent = msg;
  inp.classList.remove('err'); void inp.offsetWidth; inp.classList.add('err');
  setTimeout(() => { inp.classList.remove('err'); $('v-err').textContent=''; }, 600);
}

// ===================================================
// 表示レンダリング
// ===================================================
function render() {
  let html = '';
  for (const c of committed) html += `<span class="t">${c}</span>`;
  if (si < segs.length) {
    for (const c of pending) html += `<span class="t">${c}</span>`;
    const rest = valid[0].slice(pending.length);
    for (let ri=0; ri<rest.length; ri++)
      html += `<span class="${ri===0?'c':'r'}">${rest[ri]}</span>`;
    for (let fi=si+1; fi<segs.length; fi++)
      for (const c of segs[fi].patterns[0])
        html += `<span class="r">${c}</span>`;
  }
  $('v-romaji').innerHTML = html;

  const alts = valid.filter(p => p !== valid[0]);
  $('v-alt').innerHTML = alts.length
    ? '別の入力: ' + alts.map(p=>`<span class="badge">${p}</span>`).join(' ')
    : '';

  inp.value = committed + pending;
}

function updateStats() {
  $('v-score').textContent = score;
  $('v-correct').textContent = correct;
  $('v-miss').textContent = missCnt;
}

// 初回ロード時にスタート画面のハイスコアを表示
renderStartHS();
</script>
